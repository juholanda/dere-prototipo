<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width,initial-scale=1">
<title>a-DeRE · Link de ativação</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../design-system/ds.css?v=51">
<script src="../design-system/ds-tailwind.js"></script>
<style>
  body{margin:0;font-family:var(--font-sans);color:var(--color-text)}
  .wrap{min-height:100vh;display:grid;grid-template-columns:minmax(340px,42%) 1fr}

  /* ===== Painel esquerdo (azul + prédio) — igual criar-senha, sem stepper ===== */
  .aside{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:var(--space-12);color:var(--color-on-navy);
    background:var(--gradient-auth), url('img/fazenda.png') center bottom/cover no-repeat, var(--color-primary-hover)}
  .aside__wm{font-size:var(--text-xl);font-weight:800;letter-spacing:-.01em}
  .aside__mid{max-width:30ch}
  .aside__mid h2{font-size:var(--text-2xl);color:inherit;line-height:1.3;margin:0 0 var(--space-3)}
  .aside__mid p{font-size:var(--text-base);line-height:1.6;color:rgba(255,255,255,.75);margin:0}
  .aside__foot{color:rgba(255,255,255,.6);font-size:var(--text-xs)}

  /* ===== Painel direito — conteúdo centralizado ===== */
  .panel{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-12) var(--space-6);background:var(--color-surface)}
  .box{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--space-6)}
  .box__ic{width:84px;height:84px}
  .box__ic svg{width:84px;height:84px;display:block}
  .head{display:flex;flex-direction:column;gap:var(--space-2)}
  .head h1{font-size:var(--text-3xl);font-weight:700;line-height:1.26;color:var(--color-heading);margin:0;text-wrap:balance}
  .head .lead{font-size:var(--text-lg);font-weight:400;line-height:1.5;color:var(--color-text-muted);margin:0}
  .acts{width:100%;display:flex;flex-direction:column;gap:var(--space-3);margin-top:var(--space-4)}
  .acts .btn{width:100%}
  .secure{display:flex;align-items:center;justify-content:center;gap:var(--space-2);color:var(--color-text-muted);font-size:var(--text-xs);line-height:1.45}
  .secure svg{width:14px;height:14px;flex:0 0 auto}

  @media(max-width:860px){.wrap{grid-template-columns:1fr}.aside{display:none}}

    /* Ilustrações (selos): cor da marca e tints vêm do DS (re-tema no dark) */
    .pgicon{color:var(--color-primary)}
    .pgicon circle:nth-of-type(3){fill:var(--color-surface);stroke:var(--blue-50)}
    .pgicon linearGradient stop:first-child{stop-color:var(--color-surface)}
    .pgicon linearGradient stop:nth-child(2){stop-color:var(--blue-50)}
    .pgicon linearGradient stop:last-child{stop-color:var(--blue-100)}
  </style>
</head>
<body>
<style id="dere-gate-css">
  #dere-gate{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:var(--space-6);background:var(--color-primary-darker);font-family:var(--font-sans)}
  #dere-gate .dgate__card{width:100%;max-width:360px;background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:var(--space-10) var(--space-8) var(--space-8);text-align:center;animation:dgateIn .38s cubic-bezier(.2,.7,.2,1) both}
  @media (prefers-reduced-motion:reduce){#dere-gate .dgate__card{animation:none}}
  @keyframes dgateIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  #dere-gate .dgate__brand{font-size:var(--text-xl);font-weight:800;letter-spacing:-.01em;color:var(--color-heading)}
  #dere-gate .dgate__sub{display:inline-flex;align-items:center;gap:var(--space-1-5);color:var(--color-text-muted);font-size:var(--text-xs);margin:var(--space-1-5) 0 var(--space-8)}
  #dere-gate .dgate__sub svg{width:14px;height:14px}
  #dere-gate .dgate__lbl{display:block;text-align:left;font-size:var(--text-xs);font-weight:600;color:var(--color-text);margin-bottom:var(--space-1-5)}
  #dere-gate .dgate__err{display:flex;align-items:center;gap:var(--space-1-5);text-align:left;min-height:var(--space-4);margin-top:var(--space-2);color:var(--color-danger);font-size:var(--text-xs)}
  #dere-gate .dgate__err svg{width:14px;height:14px;flex:0 0 auto}
  #dere-gate .dgate__foot{margin-top:var(--space-6);font-size:var(--text-2xs);letter-spacing:.02em;color:var(--color-text-muted)}
  #dere-gate form{margin:0}
  #dere-gate .btn{width:100%;justify-content:center;margin-top:var(--space-2)}
</style>
<div id="dere-gate">
  <form class="dgate__card" onsubmit="return dereGate(this)">
    <div class="dgate__brand">a-DeRE</div>
    <div class="dgate__sub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Protótipo &middot; acesso restrito</div>
    <label class="dgate__lbl" for="dere-pw">Senha de acesso</label>
    <input class="input input--lg" id="dere-pw" type="password" placeholder="Digite a senha" autofocus autocomplete="off" aria-label="Senha de acesso">
    <div class="dgate__err" id="dere-err" role="alert"></div>
    <button class="btn btn--primary btn--lg" type="submit">Entrar</button>
    <div class="dgate__foot">uma solução Axians</div>
  </form>
</div>
<script>
  if(localStorage.getItem('dere_ok')==='1'){var _g=document.getElementById('dere-gate');if(_g)_g.remove();}
  function dereGate(f){var i=f.querySelector('input'),e=document.getElementById('dere-err');
    if(i.value==='dere123'){localStorage.setItem('dere_ok','1');document.getElementById('dere-gate').remove();}
    else{e.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg> Senha incorreta. Tente novamente.';i.select();}
    return false;}
</script>

  <div class="wrap">
    <aside class="aside">
      <div class="aside__wm">a-DeRE</div>
      <div class="aside__mid">
        <h2>Declaração de Regimes Específicos da Reforma Tributária.</h2>
        <p>Cadastro, plano de contas e envio dos eventos das suas empresas, num só lugar.</p>
      </div>
      <div class="aside__foot">a-DeRE, uma solução Axians</div>
    </aside>

    <main class="panel">
      <div class="box" id="box"></div>
    </main>
  </div>

  <script>
    var motivo=(new RegExp('[?&]motivo=([^&]+)').exec(location.search)||[])[1]||'expirado';

    /* Ícone de link quebrado (Lucide unlink) no círculo azul do DS — mesmo tratamento do criar-senha */
    var UNLINK='<path d="m18.84 12.25 1.72-1.71h-.02a5.004 5.004 0 0 0-.12-7.07 5.006 5.006 0 0 0-6.95 0l-1.72 1.71"/>'+
      '<path d="m5.17 11.75-1.71 1.71a5.004 5.004 0 0 0 .12 7.07 5.006 5.006 0 0 0 6.95 0l1.71-1.71"/>'+
      '<line x1="8" x2="8" y1="2" y2="5"/><line x1="2" x2="5" y1="8" y2="8"/>'+
      '<line x1="16" x2="16" y1="19" y2="22"/><line x1="19" x2="22" y1="16" y2="16"/>';
    /* Ícone "não é mais válido / já usado" (Lucide ban) — distinto do link quebrado do expirado */
    var BAN='<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>';
    function icon(kind){
      var glyph = kind==='usado' ? BAN : UNLINK;
      return '<svg class="pgicon" width="84" height="84" viewBox="0 0 84 84" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+
        '<circle cx="42" cy="42" r="42" fill="url(#pg)"/>'+
        '<circle cx="42" cy="42" r="30" fill="currentColor" fill-opacity="0.1"/>'+
        '<circle cx="42" cy="42" r="29" fill="white" stroke="#EEF4FC" stroke-width="2"/>'+
        '<g transform="translate(30 30)" fill="none" stroke="currentColor" stroke-width="2.16667" stroke-linecap="round" stroke-linejoin="round">'+glyph+'</g>'+
        '<defs><linearGradient id="pg" x1="42" y1="61.2382" x2="42" y2="-3.26472" gradientUnits="userSpaceOnUse">'+
          '<stop offset="0.048" stop-color="white"/><stop offset="0.293" stop-color="#ECF2FB" stop-opacity="0.41"/><stop offset="1" stop-color="#D3E0F5"/>'+
        '</linearGradient></defs></svg>';
    }
    var LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

    var VIEWS={
      expirado:{
        titulo:'Este link de ativação expirou',
        texto:'Por segurança, o link de convite expira em 7 dias. Solicite um novo para criar sua senha.',
        primaria:{txt:'Solicitar novo link', href:'email.html'},
        secundaria:{txt:'Ir para o login', href:'login.html'}
      },
      usado:{
        titulo:'Este link não é mais válido',
        texto:'Este link de convite já foi usado ou cancelado. Se você já criou sua senha, é só entrar.',
        primaria:{txt:'Solicitar novo link', href:'email.html'},
        secundaria:{txt:'Ir para o login', href:'login.html'}
      }
    };
    var v=VIEWS[motivo]||VIEWS.expirado;
    document.getElementById('box').innerHTML=
      '<div class="box__ic">'+icon(motivo)+'</div>'+
      '<div class="head"><h1>'+v.titulo+'</h1><p class="lead">'+v.texto+'</p></div>'+
      '<div class="acts">'+
        '<a class="btn btn--primary btn--lg" href="'+v.primaria.href+'">'+v.primaria.txt+'</a>'+
        '<a class="btn btn--secondary btn--lg" href="'+v.secundaria.href+'">'+v.secundaria.txt+'</a>'+
      '</div>'+
      '<div class="secure">'+LOCK+' Conexão segura. A a-DeRE nunca pede sua senha por telefone ou e-mail.</div>';
  </script>
<script>
(function(){
  var MYV='1788612552';
  var seg=location.pathname.split('/'); var base='/'+(seg[1]||'')+'/version.json';
  var dirty=false;
  document.addEventListener('input',function(e){ var t=e.target; if(t&&t.matches&&t.matches('input,textarea,select')) dirty=true; },true);
  try{ if(/[?&]_cb=/.test(location.search)){ var u=new URLSearchParams(location.search); u.delete('_cb'); history.replaceState(null,'',location.pathname+(u.toString()?('?'+u.toString()):'')+location.hash); } }catch(e){}
  function goFresh(v){ var s=location.search?'&':'?'; location.replace(location.pathname+location.search+s+'_cb='+encodeURIComponent(v)+location.hash); }
  function check(force){
    fetch(base+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(d){
      if(!d||!d.v||d.v===MYV) return;
      if(force){ var k='dere_cb_'+d.v; if(!sessionStorage.getItem(k)){ sessionStorage.setItem(k,'1'); goFresh(d.v); } }
      else if(!dirty){ goFresh(d.v); }
    }).catch(function(){});
  }
  check(true);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') check(false); });
})();
</script>
</body>
</html>
