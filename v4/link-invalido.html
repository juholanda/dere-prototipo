<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>a-DeRE · Link de ativação</title>
<link rel="stylesheet" href="../design-system/ds.css?v=14">
<style>
  body{margin:0;font-family:var(--font-sans);color:var(--color-text)}
  .wrap{min-height:100vh;display:grid;grid-template-columns:minmax(340px,42%) 1fr}

  /* ===== Painel esquerdo (azul + prédio) — igual criar-senha, sem stepper ===== */
  .aside{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:var(--space-12);color:#fff;
    background:linear-gradient(rgba(17,62,140,.93),rgba(10,40,96,.96)), url('img/fazenda.png') center bottom/cover no-repeat, var(--color-primary-hover)}
  .aside__wm{font-size:var(--text-xl);font-weight:800;letter-spacing:-.01em}
  .aside__mid{max-width:30ch}
  .aside__mid h2{font-size:var(--text-2xl);color:inherit;line-height:1.3;margin:0 0 var(--space-3)}
  .aside__mid p{font-size:var(--text-base);line-height:1.6;color:rgba(255,255,255,.75);margin:0}
  .aside__foot{color:rgba(255,255,255,.6);font-size:var(--text-xs)}

  /* ===== Painel direito — conteúdo centralizado ===== */
  .panel{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-12) var(--space-6);background:var(--color-surface)}
  .box{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--space-6)}
  .box__ic{width:84px;height:84px}
  .box__ic svg{width:84px;height:84px;display:block}
  .head{display:flex;flex-direction:column;gap:var(--space-2)}
  .head h1{font-size:var(--text-3xl);font-weight:700;line-height:1.26;color:var(--color-heading);margin:0;text-wrap:balance}
  .head .lead{font-size:var(--text-lg);font-weight:400;line-height:1.5;color:var(--color-text-muted);margin:0}
  .acts{width:100%;display:flex;flex-direction:column;gap:var(--space-3)}
  .acts .btn{width:100%}
  .secure{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--color-text-muted);font-size:var(--text-xs);line-height:1.45}
  .secure svg{width:14px;height:14px;flex:0 0 auto}

  @media(max-width:860px){.wrap{grid-template-columns:1fr}.aside{display:none}}
</style>
</head>
<body>
<style>    #dere-gate .dots{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 12% 22%,rgba(255,255,255,.06),transparent),radial-gradient(2px 2px at 82% 15%,rgba(255,255,255,.05),transparent),radial-gradient(1.5px 1.5px at 68% 62%,rgba(255,255,255,.05),transparent),radial-gradient(2px 2px at 27% 78%,rgba(255,255,255,.045),transparent),radial-gradient(1.5px 1.5px at 90% 82%,rgba(255,255,255,.05),transparent),radial-gradient(2px 2px at 45% 34%,rgba(255,255,255,.04),transparent),radial-gradient(1.5px 1.5px at 8% 55%,rgba(255,255,255,.05),transparent),radial-gradient(2px 2px at 58% 90%,rgba(255,255,255,.04),transparent)}
    #dere-gate .card{animation:dereIn .38s cubic-bezier(.2,.7,.2,1) both}
    @media (prefers-reduced-motion:reduce){#dere-gate .card{animation:none}
    #dere-gate input:focus{border-color:#1351b4 !important;box-shadow:0 0 0 3px rgba(19,81,180,.18) !important}
    #dere-gate button:hover{background:#0c326f !important}
    #dere-gate button:active{transform:translateY(1px)}
    #dere-gate .dots{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 12% 22%,rgba(255,255,255,.06),transparent),radial-gradient(2px 2px at 82% 15%,rgba(255,255,255,.05),transparent),radial-gradient(1.5px 1.5px at 68% 62%,rgba(255,255,255,.05),transparent),radial-gradient(2px 2px at 27% 78%,rgba(255,255,255,.045),transparent),radial-gradient(1.5px 1.5px at 90% 82%,rgba(255,255,255,.05),transparent),radial-gradient(2px 2px at 45% 34%,rgba(255,255,255,.04),transparent),radial-gradient(1.5px 1.5px at 8% 55%,rgba(255,255,255,.05),transparent),radial-gradient(2px 2px at 58% 90%,rgba(255,255,255,.04),transparent)}</style>
<div id="dere-gate" style="position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:24px;font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;background:radial-gradient(120% 120% at 20% 8%,#0c326f 0%,#071d41 55%,#05152e 100%)">
  <style>
    #dere-gate .dots{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 12% 22%,rgba(255,255,255,.06),transparent),radial-gradient(2px 2px at 82% 15%,rgba(255,255,255,.05),transparent),radial-gradient(1.5px 1.5px at 68% 62%,rgba(255,255,255,.05),transparent),radial-gradient(2px 2px at 27% 78%,rgba(255,255,255,.045),transparent),radial-gradient(1.5px 1.5px at 90% 82%,rgba(255,255,255,.05),transparent),radial-gradient(2px 2px at 45% 34%,rgba(255,255,255,.04),transparent),radial-gradient(1.5px 1.5px at 8% 55%,rgba(255,255,255,.05),transparent),radial-gradient(2px 2px at 58% 90%,rgba(255,255,255,.04),transparent)}
    #dere-gate .card{animation:dereIn .38s cubic-bezier(.2,.7,.2,1) both}
    @keyframes dereIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){#dere-gate .card{animation:none}}
    #dere-gate input:focus{border-color:#1351b4 !important;box-shadow:0 0 0 3px rgba(19,81,180,.18) !important}
    #dere-gate button:hover{background:#0c326f !important}
    #dere-gate button:active{transform:translateY(1px)}
  </style>
  <span class="dots"></span>
  <form class="card" onsubmit="return dereGate(this)" style="position:relative;background:#fff;padding:38px 34px 26px;border-radius:14px;width:100%;max-width:360px;text-align:center;box-shadow:0 24px 70px -12px rgba(3,17,42,.55)">
    <div style="font-size:21px;font-weight:800;color:#0b1f3a;letter-spacing:-.01em;font-family:inherit">DeRE</div>
    <div style="display:inline-flex;align-items:center;gap:6px;color:#5b6b82;font-size:13px;margin:5px 0 22px;font-family:inherit"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Protótipo &middot; acesso restrito</div>
    <label for="dere-pw" style="display:block;text-align:left;font-size:12.5px;font-weight:600;color:#334155;margin:0 0 6px;font-family:inherit">Senha de acesso</label>
    <input id="dere-pw" type="password" placeholder="Digite a senha" autofocus autocomplete="off" aria-label="Senha de acesso" style="width:100%;height:44px;border:1px solid #cbd5e1;border-radius:8px;padding:0 14px;font-size:16px;box-sizing:border-box;outline:none;color:#0f172a;background:#fff;font-family:inherit">
    <div id="dere-err" style="color:#dc2626;font-size:12.5px;min-height:18px;margin-top:8px;text-align:left;display:flex;align-items:center;gap:5px;font-family:inherit"></div>
    <button type="submit" style="width:100%;height:44px;margin-top:6px;background:#1351b4;color:#fff;border:0;border-radius:8px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit">Entrar</button>
    <div style="margin-top:20px;font-size:11.5px;color:#94a3b8;letter-spacing:.02em;font-family:inherit">uma solução Axians</div>
  </form>
</div>
<script>if(localStorage.getItem('dere_ok')==='1'){var _g=document.getElementById('dere-gate');if(_g)_g.remove();}function dereGate(f){var i=f.querySelector('input'),e=document.getElementById('dere-err');if(i.value==='dere123'){localStorage.setItem('dere_ok','1');document.getElementById('dere-gate').remove();}else{e.innerHTML='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>Senha incorreta. Tente novamente.';i.select();}return false;}</script>
  <div class="wrap">
    <aside class="aside">
      <div class="aside__wm">a-DeRE</div>
      <div class="aside__mid">
        <h2>Declaração de Regimes Específicos da Reforma Tributária.</h2>
        <p>Cadastro, plano de contas e envio dos eventos das suas empresas, num só lugar.</p>
      </div>
      <div class="aside__foot">a-DeRE, uma solução Axians</div>
    </aside>

    <main class="panel">
      <div class="box" id="box"></div>
    </main>
  </div>

  <script>
    var motivo=(new RegExp('[?&]motivo=([^&]+)').exec(location.search)||[])[1]||'expirado';

    /* Ícone de link quebrado (Lucide unlink) no círculo azul do DS — mesmo tratamento do criar-senha */
    var UNLINK='<path d="m18.84 12.25 1.72-1.71h-.02a5.004 5.004 0 0 0-.12-7.07 5.006 5.006 0 0 0-6.95 0l-1.72 1.71"/>'+
      '<path d="m5.17 11.75-1.71 1.71a5.004 5.004 0 0 0 .12 7.07 5.006 5.006 0 0 0 6.95 0l1.71-1.71"/>'+
      '<line x1="8" x2="8" y1="2" y2="5"/><line x1="2" x2="5" y1="8" y2="8"/>'+
      '<line x1="16" x2="16" y1="19" y2="22"/><line x1="19" x2="22" y1="16" y2="16"/>';
    function icon(){
      return '<svg width="84" height="84" viewBox="0 0 84 84" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+
        '<circle cx="42" cy="42" r="42" fill="url(#pg)"/>'+
        '<circle cx="42" cy="42" r="30" fill="#1351B4" fill-opacity="0.1"/>'+
        '<circle cx="42" cy="42" r="29" fill="white" stroke="#EEF4FC" stroke-width="2"/>'+
        '<g transform="translate(30 30)" fill="none" stroke="#1351B4" stroke-width="2.16667" stroke-linecap="round" stroke-linejoin="round">'+UNLINK+'</g>'+
        '<defs><linearGradient id="pg" x1="42" y1="61.2382" x2="42" y2="-3.26472" gradientUnits="userSpaceOnUse">'+
          '<stop offset="0.048" stop-color="white"/><stop offset="0.293" stop-color="#ECF2FB" stop-opacity="0.41"/><stop offset="1" stop-color="#D3E0F5"/>'+
        '</linearGradient></defs></svg>';
    }
    var LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

    var VIEWS={
      expirado:{
        titulo:'Este link de ativação expirou',
        texto:'Por segurança, o link de convite expira em 24 horas. Solicite um novo para criar sua senha.',
        primaria:{txt:'Solicitar um novo link', href:'email.html'},
        secundaria:{txt:'Já tenho senha, entrar', href:'login.html'}
      },
      usado:{
        titulo:'Este link não é mais válido',
        texto:'Este link de convite já foi usado ou cancelado. Se você já criou sua senha, é só entrar.',
        primaria:{txt:'Ir para o login', href:'login.html'},
        secundaria:{txt:'Solicitar um novo link', href:'email.html'}
      }
    };
    var v=VIEWS[motivo]||VIEWS.expirado;
    document.getElementById('box').innerHTML=
      '<div class="box__ic">'+icon()+'</div>'+
      '<div class="head"><h1>'+v.titulo+'</h1><p class="lead">'+v.texto+'</p></div>'+
      '<div class="acts">'+
        '<a class="btn btn--primary btn--lg" href="'+v.primaria.href+'">'+v.primaria.txt+'</a>'+
        '<a class="btn btn--secondary btn--lg" href="'+v.secundaria.href+'">'+v.secundaria.txt+'</a>'+
      '</div>'+
      '<div class="secure">'+LOCK+' Conexão segura. A a-DeRE nunca pede sua senha por telefone ou e-mail.</div>';
  </script>
</body>
</html>
